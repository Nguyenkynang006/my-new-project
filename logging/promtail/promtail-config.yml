# ============================================================
# CRM Customer Care — Promtail Configuration
# ============================================================
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576

scrape_configs:
  # ── Tự động phát hiện và thu thập log Docker Containers ──
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    relabel_configs:
      # Chỉ thu thập log của các service CRM (app/nginx/db).
      # Dùng label com.docker.compose.service do Docker Compose tự đặt nên
      # KHÔNG phụ thuộc tên thư mục/project: nếu repo được đặt tên khác
      # (vd "MSSV-crm-customer-care"), tên container không còn bắt đầu bằng
      # "crm-" và các rule dựa trên tên container sẽ không gán được nhãn service.
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: '^(app|nginx|db)$'
        action: keep

      # Gán nhãn service theo đúng service name trong docker-compose
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

      # Gán nhãn tên container (bỏ ký tự "/" ở đầu)
      - source_labels: ['__meta_docker_container_name']
        regex: '/?(.*)'
        target_label: 'container'
        replacement: '$1'

      # Nhãn ổn định cho query/group-by
      - target_label: 'job'
        replacement: 'crm-docker'
      - target_label: 'environment'
        replacement: 'production'

    pipeline_stages:
      - docker: {}
