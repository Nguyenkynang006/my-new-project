# ============================================================
# CRM Customer Care — Promtail Configuration
# ============================================================
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576

scrape_configs:
  # ── Tự động phát hiện và thu thập log Docker Containers ──
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    relabel_configs:
      # Promtail áp dụng relabel HAI lần: lần đầu khi tạo target (còn __meta_*),
      # lần sau khi xử lý từng dòng log (đã mất __meta_*). Vì vậy mọi rule phải
      # idempotent: gán nhãn trước, rồi lọc theo nhãn đã gán (không lọc bằng
      # __meta_* ở bước keep, nếu không lượt relabel thứ 2 tạo label rỗng
      # → Loki trả 400 "at least one label pair is required per stream").
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: '(.+)'
        target_label: 'service'
        replacement: '$1'

      # Lọc theo nhãn `service` đã tạo (idempotent qua 2 lượt relabel)
      - source_labels: ['service']
        regex: '^(app|nginx|db)$'
        action: keep

      # Nhãn container: regex yêu cầu >=1 ký tự để lượt relabel thứ 2 (không còn
      # __meta_docker_container_name) không xoá mất nhãn đã có.
      - source_labels: ['__meta_docker_container_name']
        regex: '/?([^/]+)'
        target_label: 'container'
        replacement: '$1'

      # Nhãn tĩnh — bảo đảm stream luôn có ít nhất 1 label
      - target_label: 'job'
        replacement: 'crm-docker'
      - target_label: 'environment'
        replacement: 'production'

    pipeline_stages:
      - docker: {}
