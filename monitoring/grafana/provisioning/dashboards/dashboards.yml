# ============================================================
# CRM Customer Care — Grafana Dashboard Provider
# ============================================================
apiVersion: 1

providers:
  - name: "CRM Dashboards"
    orgId: 1
    folder: "CRM System"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 60
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
