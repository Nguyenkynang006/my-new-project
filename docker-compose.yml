# ============================================================
# CRM Customer Care — Docker Compose (Full Stack)
# ============================================================
services:

  # ── PostgreSQL Database ──────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm_db}
      POSTGRES_USER: ${POSTGRES_USER:-crm_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      CRM_APP_USER: ${CRM_APP_USER:-crm_app}
      CRM_APP_PASSWORD: ${CRM_APP_PASSWORD:?set CRM_APP_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── DB migration (one-shot) ─────────────────────────────────
  # Đồng bộ schema/quyền cho volume đã tồn tại (init script chỉ chạy khi volume rỗng).
  # Idempotent → chạy lại mỗi lần `docker compose up` đều an toàn, không xoá dữ liệu.
  db-migrate:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-crm_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-crm_db}
      APP_USER: ${CRM_APP_USER:-crm_app}
    volumes:
      - ./database/migrations:/migrations:ro
    depends_on:
      db: { condition: service_healthy }
    networks: [data]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for f in /migrations/*.sql; do
          echo "[db-migrate] applying $$f"
          psql -v ON_ERROR_STOP=1 -v app_user="$$APP_USER" -f "$$f"
        done
        echo "[db-migrate] done"

  # ── CRM Application (Node.js + Express) ─────────────────────
  app:
    build: ./app
    restart: unless-stopped
    environment:
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-crm_db}
      DB_USER: ${CRM_APP_USER:-crm_app}
      DB_PASSWORD: ${CRM_APP_PASSWORD:?set CRM_APP_PASSWORD in .env}
    depends_on:
      db: { condition: service_healthy }
      db-migrate: { condition: service_completed_successfully }
    networks: [edge, data, monitoring]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── pgAdmin ─────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:8
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?set PGADMIN_DEFAULT_PASSWORD in .env}
      PGADMIN_LISTEN_PORT: "80"
    ports: ["${BIND_ADDR:-127.0.0.1}:5050:80"]
    networks: [data, edge]
    depends_on:
      db: { condition: service_healthy }

  # ── Nginx Reverse Proxy ────────────────────────────────────
  nginx:
    build: ./nginx
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:80:80"
      - "${BIND_ADDR:-127.0.0.1}:443:443"
    depends_on:
      app: { condition: service_healthy }
    networks: [edge, monitoring]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Nginx Prometheus Exporter ──────────────────────────────
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1
    restart: unless-stopped
    command: ["--nginx.scrape-uri=http://nginx:8080/stub_status"]
    depends_on:
      nginx: { condition: service_healthy }
    networks: [monitoring]

  # ── PostgreSQL Exporter ────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${CRM_APP_USER:-crm_app}:${CRM_APP_PASSWORD:?set CRM_APP_PASSWORD}@db:5432/${POSTGRES_DB:-crm_db}?sslmode=disable"
    depends_on:
      db: { condition: service_healthy }
      db-migrate: { condition: service_completed_successfully }
    networks: [data, monitoring]

  # ── cAdvisor (Container Metrics) ───────────────────────────
  # v0.53.0+ dùng registry ghcr.io/google/cadvisor (gcr.io chỉ còn cho bản cũ).
  # v0.54.0 có fix hỗ trợ containerd-snapshotter (lỗi "read-write layer ID").
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    # --docker_only: chỉ thu thập container Docker (bỏ cgroup /system.slice/...),
    # giúp container_last_seen và các label Compose xuất hiện đúng.
    command:
      - "--docker_only=true"
      - "--store_container_labels=true"
      - "--housekeeping_interval=10s"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      # Docker data-root có thể khác /var/lib/docker (Docker cài bằng snap dùng thư mục khác).
      # Kiểm tra: docker info --format '{{.DockerRootDir}}' rồi đặt DOCKER_DATA_ROOT.
      - ${DOCKER_DATA_ROOT:-/var/lib/docker}:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [monitoring]

  # ── Prometheus ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    user: "nobody"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports: ["${BIND_ADDR:-127.0.0.1}:9090:9090"]
    depends_on:
      app: { condition: service_healthy }
    networks: [edge, monitoring]

  # ── Grafana ────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Bật WAL cho SQLite nội bộ → giảm lỗi "database is locked" khi có nhiều ghi đồng thời.
      GF_DATABASE_WAL: "true"
      # SQLite chỉ cho 1 writer: giới hạn pool về 1 connection để tránh tranh chấp lock.
      GF_DATABASE_MAX_OPEN_CONNS: "1"
      # Môi trường demo không có DNS ra grafana.com → tắt kiểm tra cập nhật/usage stats
      # để tránh log nhiễu "lookup grafana.com on 127.0.0.11: server misbehaving".
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports: ["${BIND_ADDR:-127.0.0.1}:3001:3000"]
    depends_on:
      prometheus: { condition: service_started }
    networks: [edge, monitoring]

  # ── Loki (Centralized Logging) ─────────────────────────────
  loki:
    image: grafana/loki:2.9.6
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./logging/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks: [monitoring]

  # ── Promtail (Log Collector) ───────────────────────────────
  promtail:
    image: grafana/promtail:2.9.6
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./logging/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DOCKER_DATA_ROOT:-/var/lib/docker}/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks: [monitoring]

# ── Networks ─────────────────────────────────────────────────
networks:
  edge: {}
  data:
    internal: true
  monitoring:
    internal: true

# ── Volumes ──────────────────────────────────────────────────
volumes:
  postgres_data: {}
  prometheus_data: {}
  grafana_data: {}
  loki_data: {}
